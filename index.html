<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>All-in English – IELTS Prep B1–C2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1e2340;--mut:#6a7090;--pri:#4338ca;--pri2:#eef0ff;--ok:#15803d;--okb:#e7f7ec;--bad:#b91c1c;--badb:#fdecec;--bd:#e2e5f1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--card:#1b1e3a;--ink:#eceefc;--mut:#9ba0c4;--pri:#8b93ff;--pri2:#262a54;--ok:#5fd18a;--okb:#16301f;--bad:#ff8c8c;--badb:#3a1c1f;--bd:#2c3060;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}h1 span{color:var(--pri)}h2{font-size:1.1rem;margin:0 0 4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(30,35,64,.06);transition:.2s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill,.tab,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;transition:.2s}
.pill.on,.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tabs{display:flex;gap:6px;margin:14px 0;border-bottom:1px solid var(--bd);padding-bottom:12px}.tab{flex:1;border-radius:12px;font-weight:600}
.bar{height:8px;background:var(--pri2);border-radius:9px;overflow:hidden;flex:1;min-width:120px}.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.stats{font-size:.85rem;color:var(--mut);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.fc{min-height:230px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}.fc:hover{border-color:var(--pri);transform:translateY(-2px)}
.fc .wd{font-size:1.6rem;font-weight:700;margin:8px 0 2px}.mut{color:var(--mut);font-size:.9rem}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff}
.B1{background:#16a34a}.B2{background:#2563eb}.C1{background:#7c3aed}.C2{background:#db2777}
.btn.pr{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.lr{background:var(--okb);color:var(--ok);border-color:var(--ok)}
select{font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink)}
.q{margin-top:14px;padding-top:12px;border-top:1px dashed var(--bd)}.q p{margin:0 0 8px;font-weight:600}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--pri);background:var(--pri2)}.opt:disabled{cursor:default}
.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--bad);color:var(--bad)}
.ex{font-weight:400!important;font-size:.92rem;padding:8px 12px;border-radius:10px;margin-top:6px!important}.okt{background:var(--okb)}.badt{background:var(--badb)}
.f{background:var(--pri2);border-radius:10px;padding:8px 12px;font-family:ui-monospace,Menlo,monospace;font-size:.88rem;margin:8px 0}
ul{margin:6px 0;padding-left:20px}.stack>*+*{margin-top:16px}
.hw{border-bottom:2px dotted var(--pri);color:var(--pri);font-weight:600;cursor:help}
#tip{position:fixed;z-index:9;max-width:240px;background:var(--ink);color:var(--bg);font-size:.85rem;padding:8px 11px;border-radius:10px;display:none;pointer-events:none}
.txt{font-size:1.02rem;line-height:1.75}.sc{float:right;font-weight:700;color:var(--pri)}
@media(max-width:480px){.w{padding:12px}.tab{padding:8px 8px;font-size:.8rem;white-space:nowrap;flex:1 0 auto}.tabs{overflow-x:auto}}.w.lg>*:not(#m){display:none}
