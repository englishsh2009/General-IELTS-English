{l:"B1",t:"Present Perfect vs. Past Simple",r:"Use the present perfect for experiences, unfinished time periods and past events with a result now. Use the past simple for finished actions at a specific past time.",f:"have/has + past participle  |  subject + V2 (past)",ex:["I have lived here for five years. (still true)","I lived in Paris in 2015. (finished)","She has lost her keys. (she can’t get in now)"],
q:[["I ____ to Rome three times.",["went","have been","was"],1,"An experience up to now with no finished time → present perfect."],["She ____ her keys yesterday.",["has lost","lost","have lost"],1,"‘Yesterday’ is a finished time, so we need the past simple."],["____ you ever eaten sushi?",["Did","Were","Have"],2,"‘Ever’ asks about life experience up to now → present perfect."]]},
{l:"B2",t:"Mixed Conditionals & Passive Voice",r:"A mixed conditional links a past condition to a present result (or the reverse). The passive focuses on the action rather than who did it, and can be used with any tense.",f:"If + past perfect, would + base verb  |  be + past participle",ex:["If I had studied law, I would be a judge now.","If she weren’t so shy, she would have spoken up.","The bridge will have been repaired by June."],
q:[["If I had taken the job, I ____ in London now.",["would have lived","would be living","will live"],1,"Past condition + present result: would + base verb."],["If she weren’t so shy, she ____ the presentation last week.",["would give","will have given","would have given"],2,"Present state + past result: would have + past participle."],["The report ____ by the time we arrive.",["will finish","will have been finished","has finishing"],1,"Future perfect passive: will have been + past participle."]]},
{l:"C1",t:"Inversion for Emphasis",r:"After negative or restrictive adverbs placed at the start of a sentence, the auxiliary comes before the subject. This is formal and emphatic.",f:"Negative adverb + auxiliary + subject + verb",ex:["Never have I seen such a beautiful sunset.","Not only was he late, but he also forgot the files.","Hardly had we left when it started to rain."],

{l:"C2",t:"Subjunctive Mood & Cleft Sentences",r:"The subjunctive uses the base verb after verbs of demand or suggestion. Cleft sentences split a sentence to emphasise one element.",f:"suggest/insist that + subject + base verb  |  It is/was X that… / What… is…",ex:["The board insisted that he resign immediately.","It was Maria who solved the problem.","What I need is a long holiday."],

{l:"B1",t:"Past Perfect",r:"Use the past perfect for an action that happened before another past action or time.",f:"had + past participle",ex:["When I arrived, the film had already started.","She was tired because she hadn’t slept.","I realised I had left my phone at home."],q:[["When we got to the station, the train ____.",["already left","had already left","has already left"],1,"The leaving happened before we arrived → past perfect."],["I was upset because I ____ my wallet.",["had lost","have lost","lose"],0,"The losing came before the upset feeling."],["She had never ____ snow before moving to Canada.",["saw","seen","see"],1,"had + past participle (seen)."]]},
{l:"B2",t:"Reported Speech",r:"When we report what someone said, we usually shift the tense back and change pronouns and time expressions.",f:"said (that) + backshifted tense",ex:["‘I am tired.’ → She said she was tired.","‘I’ll call you.’ → He said he would call me.","‘I have finished.’ → She said she had finished."],q:[["‘I am tired.’ → She said she ____ tired.",["is","has been","was"],2,"Present simple backshifts to past simple."],["‘I’ll call you.’ → He said he ____ me.",["would call","will call","calls"],0,"will backshifts to would."],["‘I have finished.’ → She said she ____.",["has finished","had finished","finishes"],1,"Present perfect backshifts to past perfect."]]},
{l:"C1",t:"Participle Clauses",r:"Participle clauses make writing more concise by replacing a full clause with an -ing, -ed or having + past participle form. The subject must be the same in both parts.",f:"V-ing / Having + V3 / V3 + main clause",ex:["Having finished the report, she went home.","Walking down the street, I met an old friend.","Written in 1925, the novel is still popular."],q:[["____ the email, he closed his laptop.",["Sent","Having sent","To send"],1,"The sending was completed first → having + past participle."],["____ by the storm, the village lost power.",["Hitting","Hit","Having hitting"],1,"Passive meaning (the village was hit) → past participle."],["____ the road, I saw an accident.",["Crossing","Crossed","To crossed"],0,"Two simultaneous active actions → -ing form."]]},
{l:"C2",t:"Inversion in Conditionals",r:"In formal English, conditionals can drop ‘if’ and invert the subject and auxiliary verb.",f:"Had + S + V3  |  Were + S + to + V  |  Should + S + V",ex:["Had I known, I would have called. (= If I had known)","Were he to resign, the firm would collapse.","Should you need help, please contact us."],q:[["____ I known about the delay, I would have left earlier.",["Had","If had","Would"],0,"Third conditional inverts to ‘Had + subject + past participle’."],["____ you need assistance, call reception.",["Were","Should","Would"],1,"‘Should + subject + base verb’ replaces ‘If you need’."],["Were she ____ apply, she would get the job.",["will","been","to"],2,"‘Were + subject + to + verb’ replaces ‘If she applied’."]]},
{l:"B1",t:"Comparatives & Superlatives",r:"Add -er/-est to short adjectives and use more/most with longer ones. Use ‘than’ to compare two things.",f:"adj + -er + than  |  the + adj + -est  |  more/most + long adj",ex:["My bag is lighter than yours.","This is the hottest day of the year.","The film was more interesting than the book."],q:[["This book is ____ than the film.",["more interesting","interestinger","most interesting"],0,"Long adjectives use ‘more’."],["It’s the ____ day of the year.",["hotter","hottest","most hot"],1,"Superlative of a short adjective: the hottest."],["She runs ____ than her brother.",["more fast","fastest","faster"],2,"Short adjective + -er + than."]]},
{l:"B2",t:"Relative Clauses",r:"Defining clauses identify which person or thing we mean. Non-defining clauses add extra information between commas and cannot use ‘that’.",f:"noun + who/which/that + clause  |  noun, who/which + clause,",ex:["The woman who lives next door is a doctor.","My brother, who lives in Spain, is visiting.","This is the house where I grew up."],q:[["My sister, ____ lives in Berlin, is a pilot.",["that","who","which"],1,"Non-defining clause about a person: who (never ‘that’)."],["The book ____ I borrowed was fascinating.",["who","where","that"],2,"Defining clause about a thing: that or which."],["That is the café ____ we first met.",["where","who","which"],0,"A place → where."]]},
{l:"C1",t:"Wish & If Only",r:"Use wish / if only + past perfect for regrets about the past, past simple for unreal present situations, and would for annoying habits.",f:"wish + had + V3 (regret)  |  wish + V2 (present)  |  wish + would (annoyance)",ex:["I wish I had studied harder.","If only I were taller!","I wish you would stop interrupting."],q:[["I wish I ____ more time at university.",["spent","had spent","would spend"],1,"Regret about the past → past perfect."],["I wish you ____ making that noise!",["stop","stopped","would stop"],2,"Annoyance about someone’s behavior → would."],["If only I ____ taller!",["were","had been","would be"],0,"Unreal present → past simple (were)."]]},

const R=[
{l:"B1",t:"A Ten-Minute Walk",x:"Many people spend most of the day sitting at a desk or looking at a screen. Doctors say this can harm our health, but there is a simple {solution|an answer to a problem}: a short walk. Researchers in the UK asked office workers to walk for just ten minutes after lunch. After two weeks, most of the group reported more {energy|the strength to be active without getting tired} and said they could {concentrate|focus your attention on one thing} better in the afternoon. Walking also helps us {relax|become calmer and less worried}. One participant, Tom, said he used to feel tired by three o’clock. Now he returns to his desk feeling fresh and ready to work. The best part is that a walk is free and you do not need special equipment. You just need comfortable shoes and a little {motivation|the desire or reason to do something}. So next time you feel tired at work, stand up and go outside. Your body and your brain will thank you.",
q:[["What is the main idea of the text?",["Office workers should change jobs","A short walk can improve energy and focus","Doctors dislike screens"],1,"The whole text shows how a ten-minute walk helps energy and concentration."],["What can we infer about Tom?",["He dislikes walking","He bought new shoes","His afternoons have improved"],2,"He used to feel tired; now he feels fresh, so the walk has helped."],["In the text, ‘concentrate’ means…",["walk slowly","focus attention","feel tired"],1,"To concentrate is to focus your mind on something."]]},
{l:"B2",t:"The Four-Day Week",x:"Several countries have recently {trialled|tested something new for a limited time} a four-day working week, and the results have surprised even the {sceptics|people who doubt that something is true or useful}. In one large pilot, employees kept their full salary but worked 32 hours instead of 40. Most companies reported that productivity stayed the same, while staff took fewer sick days and many described feeling less {burned out|exhausted from too much stress or work}. Supporters argue that a shorter week forces teams to cut pointless meetings and focus on what truly matters. Critics, however, warn that the model may not suit every sector. Hospitals and shops, for instance, must stay open, so reducing hours could mean hiring more staff, which is {costly|expensive}. Others worry that employees will simply compress five days of work into four and feel even more {pressured|under stress to do something quickly or well}. Nevertheless, the evidence so far suggests that when work is organised sensibly, working less does not necessarily mean achieving less. The debate is likely to continue as more firms experiment with the idea.",

{l:"C1",t:"The Lure of the Infinite Scroll",x:"Few design features have been as {pervasive|present or noticeable everywhere} – or as controversial – as the infinite scroll. By removing the natural stopping points of a page, it encourages {compulsive|done as a habit that is hard to control} browsing, and many users report losing track of time entirely. Former engineers have admitted that such features were deliberately designed to maximize engagement, exploiting our tendency to seek novelty. The consequences are difficult to {quantify|measure or express as a number}, yet studies link heavy usage to fragmented attention and disrupted sleep. Regulators in several countries now {scrutinize|examine very carefully and critically} these practices, and some propose mandatory prompts reminding people to take breaks. Technology companies counter that users retain full agency and that content, not design, drives behavior. Psychologists remain unconvinced by this defense, noting that willpower is a finite resource and is easily {eroded|gradually worn away} by systems built to circumvent it. Whether legislation can meaningfully reduce the problem remains an open question, but the conversation has undeniably shifted from personal failing to corporate responsibility.",
q:[["The author’s central argument is that…",["infinite scroll is harmless","users just need more willpower","responsibility for addictive design is shifting toward companies"],2,"The final sentence states the shift from personal failing to corporate responsibility."],["What does the text imply about tech companies’ position?",["They accept all blame","They claim users remain in control","They want stricter laws"],1,"They counter that users retain full agency."],["‘Eroded’ most nearly means…",["quickly increased","carefully measured","gradually weakened"],2,"Willpower is slowly worn away by manipulative systems."]]},
{l:"C2",t:"The Tyranny of Optimization",x:"Contemporary culture is {ostensibly|apparently, but perhaps not in reality} devoted to efficiency: we track our sleep, quantify our steps and curate our schedules to the minute. Yet this relentless optimization may {engender|cause or produce, especially a feeling or situation} a peculiar form of anxiety, in which every idle hour registers as a failure. The old warning is {germane|relevant and appropriate to the subject} here: when a measure becomes a target, it ceases to be a good measure. Hobbies are monetized, friendships are networked, and even rest is repackaged as ‘recovery’ in service of productivity. What disappears is the {ephemeral|lasting for a very short time}, unquantifiable texture of ordinary life – the aimless conversation, the unplanned detour – experiences whose value resists any spreadsheet. Critics dismiss this view as mere {nostalgia|a sentimental longing for the past}, arguing that technology simply empowers choice. But the counterargument is subtler than wistfulness: it holds that when every moment is instrumentalized, we lose the capacity for pleasure that serves no purpose beyond itself. Perhaps, then, the most radical act available to a modern professional is simply to waste an afternoon, unapologetically and without a metric in sight.",

{l:"B1",t:"A Day Without Phones",x:"Last month, a school in Spain asked its students to spend one whole day without their phones. At first, many teenagers felt {anxious|worried and unable to relax} and kept checking their empty pockets. But by lunchtime, something changed. Students started to {chat|talk in a friendly, informal way} in the corridors and play games outside. One girl, Lucia, said she had a real conversation with a classmate for the first time. Teachers also noticed that lessons were calmer and pupils paid more {attention|careful listening or watching}. Of course, not everyone enjoyed it. Some students felt {bored|uninterested because nothing is happening} and missed their friends online. Still, most agreed that a break from screens was a good {experience|something that happens to you and teaches you something}. The school now plans to repeat the day every month.",q:[["What was the main result of the day?",["Students were angry all day","Students talked more and lessons were calmer","Teachers lost control"],1,"Students chatted, played outside, and lessons were calmer."],["What can we infer about Lucia?",["She usually talked less face-to-face","She hates school","She lost her phone"],0,"It was her first real conversation with a classmate, so phones normally got in the way."],["‘Bored’ means…",["afraid","uninterested because nothing is happening","very happy"],1,"Bored = uninterested and restless."]]},
{l:"B2",t:"Why We Procrastinate",x:"Procrastination is often blamed on laziness, but psychologists increasingly see it differently. According to recent research, people {postpone|delay until a later time} tasks not because they are careless, but because they want to avoid unpleasant feelings such as boredom, anxiety or self-doubt. Putting something off brings immediate {relief|a feeling of comfort when something worrying ends}, which makes the habit more tempting next time. The cost, however, arrives later in the form of stress and rushed work. Experts suggest breaking large projects into tiny steps, since starting is usually the hardest part. Another useful {strategy|a plan for achieving something} is to forgive yourself after a delay: studies show that students who were kind to themselves procrastinated less before the next exam than those who {criticized|expressed disapproval of} themselves harshly. In other words, being tough on yourself can actually make the problem worse.",q:[["Procrastination is mainly caused by…",["poor memory","a wish to avoid uncomfortable emotions","lack of intelligence"],1,"The text says people delay tasks to avoid unpleasant feelings."],["What can be inferred about self-criticism?",["It helps people work harder","It has no effect","It may increase procrastination"],2,"Self-kind students delayed less, so harshness can worsen the problem."],["‘Postpone’ is closest to…",["finish quickly","delay","ignore forever"],1,"To postpone is to delay until later."]]},
{l:"C1",t:"The Ethics of Algorithmic Hiring",x:"Many large firms now use algorithms to {screen|examine something to decide whether it is suitable} thousands of job applications in seconds. Proponents claim that software is {impartial|treating all people equally, without favoring anyone}, free from the unconscious prejudices of human recruiters. Yet the evidence is more troubling. Because these systems learn from historical data, they can quietly {perpetuate|make something continue for a long time} the very inequalities they were meant to eliminate: one well-known tool downgraded CVs containing the word ‘women’s’ simply because past hires had been mostly male. Compounding the problem is a lack of {transparency|openness that lets others see how decisions are made}; applicants rarely know why they were rejected, and even developers may struggle to explain a model’s reasoning. Legislators are therefore pressing for independent audits and a right to human review. The challenge, ultimately, is not whether to use such tools but how to hold them {accountable|required to explain or justify actions}.",q:[["The passage argues that algorithmic hiring…",["is always fairer than humans","should be banned entirely","can reproduce bias unless it is monitored"],2,"Systems trained on biased history can repeat that bias, so oversight is needed."],["Why is the downgraded-CV example mentioned?",["To praise its accuracy","To show that algorithms can learn bias from past data","To show applicants cheat"],1,"It illustrates how historical data passes on inequality."],["‘Perpetuate’ means…",["end quickly","measure","cause to continue"],2,"To perpetuate is to keep something going."]]},
{l:"C2",t:"Memory as Reconstruction",x:"We tend to imagine memory as a faithful archive, yet cognitive science paints a far more {malleable|easily changed or shaped} picture. Each time we recall an event, we do not retrieve a fixed recording but {reconstruct|build or create again} it from fragments, and the act of remembering can subtly alter what is stored. Studies of eyewitness testimony reveal how readily confident recollections can be {contaminated|made unreliable by something added} by leading questions or later conversations. This has sobering implications for the courtroom, where vivid detail is often mistaken for accuracy. Paradoxically, the very emotions that make an experience feel indelible may {distort|change the shape or meaning of something} it most. None of this renders memory worthless; rather, it invites a more {nuanced|showing small but important differences} understanding, one in which sincerity and accuracy are recognized as separate qualities. To remember, it seems, is always to interpret.",q:[["The central claim is that memory…",["is an exact record","fades at a fixed rate","is rebuilt and can be altered each time"],2,"We reconstruct memories when we recall them, and that can change them."],["Why are the courtroom implications ‘sobering’?",["Vivid testimony may be sincere but inaccurate","Witnesses always lie","Judges forget evidence"],0,"Vivid detail is often mistaken for accuracy."],["‘Malleable’ means…",["impossible to change","easily shaped or changed","very ancient"],1,"Malleable things can be reshaped."]]}];

const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),uidOf=n=>'u'+hex(enc.encode(n.trim().toLowerCase()));
